<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Giải mã Hytech</title>


  <meta name="theme-color" content="#2b2b2b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Giải mã Hytech" />
  <meta name="format-detection" content="telephone=no" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <style>
    :root {
      --bg: #2b2b2b;
      --text: #f3f3f3;
      --muted: #c4c4c4;
      --line: #3ecf8e;
      --btn: #7c5cbf;
      --btn-hover: #8f6ed4;
      --err: #ff8a8a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      width: min(440px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.75rem 0 3rem;
      padding-top: max(2.75rem, env(safe-area-inset-top));
      padding-bottom: max(3rem, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.28rem;
      font-weight: 600;
      text-align: center;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin: 0 0 1.6rem;
      font-size: 0.8rem;
      color: var(--muted);
      user-select: none;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.ready {
      background: var(--line);
      box-shadow: 0 0 6px rgba(62, 207, 142, 0.6);
    }
    .status-dot.offline {
      background: #60a5fa;
      box-shadow: 0 0 6px rgba(96, 165, 250, 0.6);
    }
    input[type="text"] {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 1.12rem;
      letter-spacing: 0.08em;
      padding: 0.75rem 0;
      outline: none;
      text-transform: uppercase;
      border-radius: 0;
    }
    input.invalid { border-bottom-color: var(--err); }
    button {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      border: 0;
      border-radius: 10px;
      background: var(--btn);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.95rem 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--btn-hover); }
    button:active { transform: scale(0.99); }
    .msg {
      margin-top: 0.9rem;
      font-size: 0.92rem;
      color: var(--err);
      display: none;
    }
    .msg.show { display: block; }
    .results {
      margin-top: 1.75rem;
      display: none;
    }
    .results.show { display: block; }
    .results .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.62rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .results .row:last-child { border-bottom: 0; }
    .results .label {
      color: var(--muted);
      font-size: 1.02rem;
      font-weight: 400;
    }
    .results .value {
      font-size: 1.22rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Giải mã Hytech</h1>
    <div class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Đang chuẩn bị offline...</span>
    </div>

    <input
      id="inHex"
      type="text"
      maxlength="16"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="characters"
      spellcheck="false"
      inputmode="text"
      placeholder=""
    />
    <button type="button" id="btnOk">XÁC NHẬN</button>
    <div class="msg" id="msg"></div>
    <div class="results" id="results">
      <div class="row">
        <span class="label">Số lít tối đa</span>
        <span class="value" id="outSlmax">—</span>
      </div>
      <div class="row">
        <span class="label">Số lít sử dụng</span>
        <span class="value" id="outSluse">—</span>
      </div>
      <div class="row">
        <span class="label">Số %</span>
        <span class="value" id="outPct">—</span>
      </div>
      <div class="row">
        <span class="label">Mã xác nhận</span>
        <span class="value" id="outCode">—</span>
      </div>
    </div>
  </div>

  <script>
(function () {
  "use strict";

  /* Tables from des.asm (IP/E/P/FP/S) + exKey from hytech.asm (key="hy@teckk") */
  var EXP_D = [32,1,2,3,4,5,4,5,6,7,8,9,8,9,10,11,12,13,12,13,14,15,16,17,16,17,18,19,20,21,20,21,22,23,24,25,24,25,26,27,28,29,28,29,30,31,32,1];
  var IP = [58,50,42,34,26,18,10,2,60,52,44,36,28,20,12,4,62,54,46,38,30,22,14,6,64,56,48,40,32,24,16,8,57,49,41,33,25,17,9,1,59,51,43,35,27,19,11,3,61,53,45,37,29,21,13,5,63,55,47,39,31,23,15,7];
  var P = [16,7,20,21,29,12,28,17,1,15,23,26,5,18,31,10,2,8,24,14,32,27,3,9,19,13,30,6,22,11,4,25];
  var FP = [40,8,48,16,56,24,64,32,39,7,47,15,55,23,63,31,38,6,46,14,54,22,62,30,37,5,45,13,53,21,61,29,36,4,44,12,52,20,60,28,35,3,43,11,51,19,59,27,34,2,42,10,50,18,58,26,33,1,41,9,49,17,57,25];
  var SFLAT = [
    14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7,0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8,4,1,14,8,13,6,2,11,15,12,9,7,3,10,5,0,15,12,8,2,4,9,1,7,5,11,3,14,10,0,6,13,
    15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10,3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5,0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15,13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9,
    10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8,13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1,13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7,1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12,
    7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15,13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9,10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4,3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14,
    2,12,4,1,7,10,11,6,8,5,3,15,13,0,14,9,14,11,2,12,4,7,13,1,5,0,15,10,3,9,8,6,4,2,1,11,10,13,7,8,15,9,12,5,6,3,0,14,11,8,12,7,1,14,2,13,6,15,0,9,10,4,5,3,
    12,1,10,15,9,2,6,8,0,13,3,4,14,7,5,11,10,15,4,2,7,12,9,5,6,1,13,14,0,11,3,8,9,14,15,5,2,8,12,3,7,0,4,10,1,13,11,6,4,3,2,12,9,5,15,10,11,14,1,7,6,0,8,13,
    4,11,2,14,15,0,8,13,3,12,9,7,5,10,6,1,13,0,11,7,4,9,1,10,14,3,5,12,2,15,8,6,1,4,11,13,12,3,7,14,10,15,6,8,0,5,9,2,6,11,13,8,1,4,10,7,9,5,0,15,14,2,3,12,
    13,2,8,4,6,15,11,1,10,9,3,14,5,0,12,7,1,15,13,8,10,3,7,4,12,5,6,11,0,14,9,2,7,11,4,1,9,12,14,2,0,6,10,13,15,3,5,8,2,1,14,7,4,10,8,13,15,12,9,0,3,5,6,11
  ];
  /* hytech.asm — key="hy@teckk" */
  var EXKEY = [
    [0xE0,0x9E,0x66,0x43,0xCB,0x0A],[0xE0,0xB6,0x72,0x04,0x8F,0x4A],[0xE4,0xD6,0x76,0x9C,0x94,0x54],[0xE6,0xD3,0x52,0x49,0xC6,0xE0],
    [0x2E,0xD3,0x73,0x18,0xEC,0x09],[0xAF,0x51,0x5B,0xAA,0x54,0x14],[0x2F,0x43,0xD9,0x89,0x63,0xA2],[0x1F,0x59,0x99,0xB4,0x4A,0x01],
    [0x1F,0x49,0xC9,0x33,0x08,0x54],[0x1B,0x69,0x9D,0xC1,0x81,0x96],[0x1D,0x2D,0x8D,0x05,0x26,0x8D],[0x53,0x2C,0xAD,0x7A,0x10,0xC5],
    [0xD9,0xAC,0xA4,0x02,0xC1,0xAF],[0xD0,0xAE,0xAE,0x06,0x3D,0x81],[0xF0,0xB6,0x26,0xEA,0x01,0x71],[0xF0,0xBE,0x26,0xE7,0xC0,0x62]
  ];
  var EXKEY_DEC = EXKEY.slice().reverse();
  var TEST_P = "766B2D2D6B68696E";

  function hexToBytes(h) {
    var o = [];
    for (var i = 0; i < h.length; i += 2) o.push(parseInt(h.substr(i, 2), 16));
    return o;
  }
  function bytesToHex(b) {
    return b.map(function (x) { return x.toString(16).padStart(2, "0"); }).join("").toUpperCase();
  }

  /* permute() in des.asm: cpi clears C, so rol in permute1 is lsl; extract bit (7-bitIdx). */
  function permute(r, data, table) {
    for (var t = 0; t < table.length; t++) {
      var tam = (table[t] - 1) & 0xff;
      var byteIdx = tam >> 3;
      var bitIdx = tam & 7;
      var src = data[byteIdx] & 0xff;
      var carry = (src >> (7 - bitIdx)) & 1;
      var c = carry;
      for (var i = 7; i >= 0; i--) {
        var nc = (r[i] >> 7) & 1;
        r[i] = ((r[i] << 1) | c) & 0xff;
        c = nc;
      }
    }
  }

  /* DES_Encryption in des.asm. Decrypt = same routine with reversed exKey. */
  function desAvr(blockHex, keys) {
    var r = [0, 0, 0, 0, 0, 0, 0, 0];
    var DESin = hexToBytes(blockHex);
    while (DESin.length < 12) DESin.push(0);

    permute(r, DESin, IP);

    for (var round = 0; round < 16; round++) {
      var i;
      for (i = 0; i < 8; i++) DESin[i] = r[i];

      permute(r, DESin.slice(4, 8), EXP_D);

      var k = keys[round];
      for (i = 0; i < 6; i++) r[2 + i] ^= k[i];

      var r10 = 0, r11 = 0, r12 = 0, r13 = 0;
      for (i = 0; i < 8; i++) {
        var row = 0, col = 0;
        var shiftInto = function (intoRow) {
          var carry = (r[7] >> 7) & 1;
          r[7] = (r[7] << 1) & 0xff;
          for (var j = 6; j >= 2; j--) {
            var nc = (r[j] >> 7) & 1;
            r[j] = ((r[j] << 1) | carry) & 0xff;
            carry = nc;
          }
          if (intoRow) row = ((row << 1) | carry) & 0xff;
          else col = ((col << 1) | carry) & 0xff;
        };
        shiftInto(true);
        shiftInto(false); shiftInto(false); shiftInto(false); shiftInto(false);
        shiftInto(true);

        var val = 64 * i + 16 * row + col;
        var tam = SFLAT[val] & 0xff;
        tam = ((tam & 0x0f) << 4) | ((tam >> 4) & 0x0f); /* swap: 4 bit thấp → cao */
        for (var b = 0; b < 4; b++) {
          var carry = (tam >> 7) & 1;
          tam = (tam << 1) & 0xff;
          var c13 = (r13 >> 7) & 1; r13 = ((r13 << 1) | carry) & 0xff;
          var c12 = (r12 >> 7) & 1; r12 = ((r12 << 1) | c13) & 0xff;
          var c11 = (r11 >> 7) & 1; r11 = ((r11 << 1) | c12) & 0xff;
          r10 = ((r10 << 1) | c11) & 0xff;
        }
      }

      permute(r, [r10, r11, r12, r13], P);

      r[4] ^= DESin[0];
      r[5] ^= DESin[1];
      r[6] ^= DESin[2];
      r[7] ^= DESin[3];
      r[0] = DESin[4];
      r[1] = DESin[5];
      r[2] = DESin[6];
      r[3] = DESin[7];
    }

    DESin = [r[4], r[5], r[6], r[7], r[0], r[1], r[2], r[3]];
    permute(r, DESin, FP);
    return bytesToHex(r);
  }

  function decryptFirmware(ctHex) {
    return desAvr(ctHex, EXKEY_DEC);
  }

  /* des.asm: 20bit slmax + 20bit sluse + 4bit % + 20bit random (MSB → LSB) */
  function parseFields(plainHex) {
    var v = BigInt("0x" + plainHex);
    return {
      slmax: Number((v >> 44n) & 0xfffffn),
      sluse: Number((v >> 24n) & 0xfffffn),
      pct: Number((v >> 20n) & 0xfn),
      rnd: Number(v & 0xfffffn)
    };
  }

  var rt = decryptFirmware(desAvr(TEST_P, EXKEY));
  if (rt !== TEST_P) {
    document.body.innerHTML = "<p style='padding:2rem'>Lỗi tự kiểm: DES firmware không roundtrip.</p>";
    return;
  }

  var inHex = document.getElementById("inHex");
  var msg = document.getElementById("msg");
  var results = document.getElementById("results");

  function showError(text) {
    msg.textContent = text;
    msg.className = "msg show";
    results.classList.remove("show");
  }

  function confirm() {
    msg.className = "msg";
    var hex = String(inHex.value || "").trim().replace(/\s+/g, "").toUpperCase();
    if (!/^[0-9A-F]{16}$/.test(hex)) {
      inHex.classList.add("invalid");
      showError("Nhập đúng 16 ký tự Hex (0-9, A-F).");
      return;
    }
    inHex.classList.remove("invalid");
    var f = parseFields(decryptFirmware(hex));
    document.getElementById("outSlmax").textContent = String(f.slmax);
    document.getElementById("outSluse").textContent = String(f.sluse);
    document.getElementById("outPct").textContent = String(f.pct);
    document.getElementById("outCode").textContent = String(f.rnd);
    results.classList.add("show");
  }

  document.getElementById("btnOk").addEventListener("click", confirm);
  inHex.addEventListener("keydown", function (e) {
    if (e.key === "Enter") confirm();
  });

  /* Service Worker & Offline Status Tracking */
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");

  function updateStatus(isReady) {
    if (!navigator.onLine) {
      if (statusDot) statusDot.className = "status-dot offline";
      if (statusText) statusText.textContent = "Chế độ ngoại tuyến (Offline)";
    } else if (isReady) {
      if (statusDot) statusDot.className = "status-dot ready";
      if (statusText) statusText.textContent = "✓ Sẵn sàng offline";
    } else {
      if (statusDot) statusDot.className = "status-dot";
      if (statusText) statusText.textContent = "Đang chuẩn bị offline...";
    }
  }

  window.addEventListener("online", function () {
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      updateStatus(true);
    } else {
      updateStatus(false);
    }
  });

  window.addEventListener("offline", function () {
    updateStatus(false);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js")
        .then(function (reg) {
          if (reg.active) {
            updateStatus(true);
          }
          reg.addEventListener("updatefound", function () {
            var installing = reg.installing;
            if (installing) {
              installing.addEventListener("statechange", function () {
                if (installing.state === "installed" || installing.state === "activated") {
                  updateStatus(true);
                }
              });
            }
          });
          if (navigator.serviceWorker.controller) {
            updateStatus(true);
          }
        })
        .catch(function () {
          if (statusText) statusText.textContent = "Không thể lưu offline";
        });
    });
  } else {
    if (statusText) statusText.textContent = "Trình duyệt không hỗ trợ PWA";
  }
})();
  </script>
</body>
</html>
