<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d7fe3"/>
      <stop offset="100%" stop-color="#6a44b8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4eebb3"/>
      <stop offset="100%" stop-color="#28b577"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring / circuit boundary -->
  <rect x="40" y="40" width="432" height="432" rx="88" fill="none" stroke="url(#greenGrad)" stroke-width="6" opacity="0.45" stroke-dasharray="16 12"/>

  <!-- Shield / Chip Icon container with shadow -->
  <g filter="url(#shadow)">
    <!-- Main shield background -->
    <path d="M 256 96 L 392 152 V 268 C 392 352 334 416 256 448 C 178 416 120 352 120 268 V 152 Z" fill="url(#purpleGrad)"/>
    
    <!-- Shield inner highlight border -->
    <path d="M 256 112 L 376 162 V 264 C 376 338 324 396 256 426 C 188 396 136 338 136 264 V 162 Z" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25"/>

    <!-- Keyhole & Lock / Cipher Core in Green -->
    <!-- Center letter 'H' with circuit style and keyhole -->
    <!-- Keyhead circle -->
    <circle cx="256" cy="226" r="44" fill="#1e1e1e" stroke="url(#greenGrad)" stroke-width="8"/>
    
    <!-- Key body extending down -->
    <path d="M 248 262 H 264 V 346 H 248 Z" fill="url(#greenGrad)"/>
    <!-- Key bits / teeth -->
    <path d="M 264 296 H 284 V 312 H 264 Z" fill="url(#greenGrad)"/>
    <path d="M 264 324 H 288 V 342 H 264 Z" fill="url(#greenGrad)"/>

    <!-- Center dot inside circle -->
    <circle cx="256" cy="226" r="14" fill="url(#greenGrad)"/>
  </g>

  <!-- Hex tech dots -->
  <circle cx="256" cy="68" r="7" fill="#3ecf8e"/>
  <circle cx="96" cy="228" r="6" fill="#3ecf8e" opacity="0.7"/>
  <circle cx="416" cy="228" r="6" fill="#3ecf8e" opacity="0.7"/>
</svg>
